name: reposell
on:
  push:
    branches:
      - main
      - master
  release:
    types:
      - published
  workflow_dispatch: null
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install reposell CLI
        run: npm install -g reposell
      - name: Validate protocol configuration
        run: reposell validate
        env:
          REPOSELL_SIGNING_KEY: ${{ secrets.REPOSELL_SIGNING_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      - name: Build /reposell/* surface
        run: reposell build --out dist
        env:
          REPOSELL_SIGNING_KEY: ${{ secrets.REPOSELL_SIGNING_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/reposell
      - id: deployment
        uses: actions/deploy-pages@v4
