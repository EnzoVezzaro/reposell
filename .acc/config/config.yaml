# reposell — ACC configuration
#
# Optional. When absent, ACC uses sensible defaults and every command
# still works. See the repository-structure spec.
schema_version: 1

# Templates — the system uses these to create and modify ACC files.
# Edit the .md files in .acc/config/templates/ to customize output.
# Uncomment to override a template path (relative to project root).
# templates:
#   agents_md: .acc/config/templates/agents.md

# Engine (AI-powered, token-gated). The AI phase only runs when the
# trigger fires — that is the token budget control. mode: commits |
# changes | always. commits → count git commits since the last
# triggered run; changes → content-hash snapshot of changed files.
# Default: 3 commits.
# engine:
#   trigger:
#     mode: commits
#     threshold: 3
#   supervisor:
#     # Second AI pass that scores proposed changes against ACC rules
#     # (0-100) before anything is written; iterates until compliant.
#     enabled: false
#     threshold: 85
#     max_iterations: 3

# AI configuration (optional, AI SDK v5). Core ACC stays offline and
# deterministic — AI is explicit opt-in and never required. Uncomment
# and edit to configure one or more providers. API keys are read from
# the environment (api_key_env), never stored in the repository.
# ai:
#   enabled: false
#   default: main
#   providers:
#     - id: main
#       provider: openai            # openai | anthropic | google | <npm package>
#       model: gpt-4o
#       api_key_env: OPENAI_API_KEY
#       base_url: null              # optional override (e.g. NVIDIA, OpenRouter)

# Exclude patterns - paths to ignore during scanning
exclude:
  - "tools/oxlint/anti-slop/**"
  - ".agents/skills/**"
  - "node_modules/**"
  - "dist/**"
  - "build/"

# Ownership
ownership:
  strict: false

# Graph settings
graph:
  # Default output format for acc graph: text | mermaid | dot | json.
  # Default: json (machine-first — agents parse it directly).
  default_format: "json"
  # Include provenance tags in text output.
  default_provenance: true

# Memory settings
memory:
  # Warn (ACC054) when a memory file exceeds this many bytes.
  warn_bytes: 65536
  # Timestamp format for acc memory add entries: rfc3339 | date.
  timestamp_format: "rfc3339"

# Discover
discover:
  # Default suggestion kinds for acc discover when --kind is not passed.
  default_kinds:
    - "missing-contract"
    - "missing-dependency"
    - "stale-dependency"
    - "unknown-owner"
    - "orphan-code"

# Multi-agent
multi_agent:
  enabled: false
  max_concurrency: 4
  max_depth: 1
  task_timeout: 300
  resource_limits:
    cpu_percent: 80
    memory_mb: 4096
    token_budget: 1000000
  isolation_mode: "git_worktree"
  conflict_policy: "sequentialize"

# Tools
tools:
  # Auto-discover project tools (package.json scripts, Cargo.toml, etc.)
  # for the acc tools manifest. acc tools is a listing, never an executor.
  auto_discover: true
  plugins:
    enabled: true
    directory: ".acc/config/tools"